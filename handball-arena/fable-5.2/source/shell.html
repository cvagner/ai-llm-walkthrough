<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Handball Arena — Fable 5.2</title>
<style>
html,body{margin:0;height:100%;background:#0f1826;overflow:hidden;font-family:system-ui,"Segoe UI",Roboto,sans-serif;color:#f0f3f7;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#score{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;font-weight:700;font-size:20px;background:rgba(15,24,38,.9);border-radius:8px;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.5)}
#score div{padding:7px 14px;display:flex;align-items:center;gap:8px}
#score .t0{border-left:6px solid #f2f4f6}#score .t1{border-right:6px solid #c8202f}
#score .n{font-size:26px;min-width:1.4em;justify-content:center;background:#042368;color:#80d8d4}
#score .clk{font-variant-numeric:tabular-nums;font-size:17px;background:#0f1826;flex-direction:column;gap:0;line-height:1.1}
#score small{font-size:11px;font-weight:600;opacity:.7;letter-spacing:.06em}
#susp{position:absolute;top:66px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:600;background:rgba(160,20,30,.85);padding:2px 10px;border-radius:4px;font-variant-numeric:tabular-nums;display:none}
#msg{position:absolute;top:98px;left:50%;transform:translateX(-50%);font-size:22px;font-weight:700;padding:8px 20px;background:rgba(15,24,38,.92);border-radius:8px;border-bottom:3px solid #00b2a9;opacity:0;transition:opacity .25s;white-space:nowrap}
#msg.on{opacity:1}
#combo{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);font-size:16px;font-weight:600;padding:6px 16px;background:rgba(4,35,104,.92);border-left:4px solid #00b2a9;border-radius:6px;opacity:0;transition:opacity .25s;white-space:nowrap}
#combo.on{opacity:1}
#bar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;font-size:13px;align-items:center;background:rgba(15,24,38,.86);padding:8px 14px;border-radius:8px;white-space:nowrap}
#bar b{font-size:14px;min-width:6.5em}#bar .k{opacity:.65}
.pips{display:inline-flex;gap:3px}.pips i{width:10px;height:10px;border-radius:50%;background:#4e5768;display:block}.pips i.on{background:#00b2a9}
#t3,#pw{display:inline-block;width:70px;height:8px;background:#4e5768;border-radius:4px;overflow:hidden}#t3 i,#pw i{display:block;height:100%;width:0;background:#00b2a9}#pw i{background:#80d8d4}
#passif{position:absolute;top:146px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:700;color:#111;background:#ffc53d;padding:3px 12px;border-radius:4px;display:none}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,35,104,.55);backdrop-filter:blur(6px)}
#menu.off{display:none}
#panel{max-width:960px;width:92%;max-height:92%;overflow:auto;background:rgba(15,24,38,.97);border-top:5px solid #00b2a9;border-radius:10px;padding:24px 30px;box-shadow:0 10px 60px rgba(0,0,0,.6)}
#panel h1{margin:0 0 2px;font-size:32px;letter-spacing:.03em;text-transform:uppercase;font-family:Oswald,"Arial Narrow","Roboto Condensed",system-ui,sans-serif;color:#fff}#panel h1::after{content:"";display:block;width:64px;height:4px;background:#00b2a9;margin-top:8px}#panel h2{font-size:13px;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.1em;color:#80d8d4}
#panel p{margin:8px 0 0;color:#c7d0dd;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
button{font:inherit;font-weight:600;color:#f0f3f7;background:#1f3a93;border:1px solid #1f3a93;border-radius:4px;padding:8px 14px;cursor:pointer}
button:hover{background:#042368;border-color:#80d8d4}button.go{background:#00b2a9;border-color:#00b2a9;color:#0f1826;font-size:17px;padding:11px 26px}button.go:hover{background:#80d8d4;border-color:#80d8d4}button.sel{background:#042368;border-color:#00b2a9;color:#80d8d4}
table{border-collapse:collapse;font-size:13px;width:100%}td,th{padding:3px 8px;text-align:left;border-bottom:1px solid rgba(146,153,165,.25)}th{color:#9299a5;font-weight:600}
kbd{background:#042368;color:#80d8d4;border-radius:4px;padding:1px 6px;font:600 12px ui-monospace,monospace;border:1px solid #1f3a93}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}@media(max-width:760px){.cols{grid-template-columns:1fr}}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:20px;padding:40px;text-align:center}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">
 <div id="score"><div class="t0"><span>HÉRONS</span></div><div class="n" id="s0">0</div><div class="clk"><span id="clk">00:00</span><small id="per">1re MI-TEMPS</small></div><div class="n" id="s1">0</div><div class="t1"><span>ATLAS</span></div></div>
 <div id="susp"></div><div id="msg"></div><div id="passif">JEU PASSIF — geste d'avertissement</div><div id="combo"></div>
 <div id="bar"><span class="k">Pas</span><span class="pips" id="pips"><i></i><i></i><i></i></span><span class="k">3 s</span><span id="t3"><i></i></span><span class="k">Tir</span><b id="shot">auto</b><span class="k">Force</span><span id="pw"><i></i></span><span class="k" id="mode"></span></div>
</div>
<div id="menu"><div id="panel"></div></div>
<div id="err"></div>
<script>/*__JS__*/</script>
</body></html>
